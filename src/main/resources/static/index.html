<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARSW Collaborative Board</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 32px auto; padding: 0 20px; line-height: 1.5; color: #333; background: #5c1a2b; }
        h1 { color: #f3e3e6; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
        .toolbar button { padding: 6px 12px; border: 1px solid #cbd6df; border-radius: 6px; background: #f6f9fb; cursor: pointer; }
        .toolbar button:hover { background: #e8f0f7; }
        .toolbar input { padding: 5px 8px; border: 1px solid #cbd6df; border-radius: 6px; width: 130px; }
        #board-id-display { margin-left: auto; align-self: center; color: #556; font-size: 14px; }
        #board-svg { border: 1px solid #cbd6df; border-radius: 8px; background: #fff; width: 100%; height: 500px; }
        .status, .hint { margin-top: 8px; padding: 6px 10px; border-radius: 6px; font-size: 14px; min-height: 20px; }
        .status-loading { background: #fff3cd; }
        .status-success { background: #d4edda; }
        .status-error { background: #f8d7da; }
        .hint { background: #e8f0f7; color: #1d2733; }
        .hint:empty { display: none; }
        .board-element.rectangle { fill: #cfe2ff; stroke: #4d7dc9; stroke-width: 1.5; cursor: move; }
        .board-element.rectangle.selected { stroke: #d9480f; stroke-width: 3; }
        .text-background { fill: #fff8dc; stroke: #d8c46a; cursor: move; }
        .board-element.text.selected .text-background { stroke: #d9480f; stroke-width: 3; }
        .text-content { font-size: 14px; pointer-events: none; }
        .connector { stroke: #556; stroke-width: 2; }
    </style>
</head>
<body>
<h1>ARSW Collaborative Architecture Board</h1>
<div class="toolbar">
    <input id="board-name-input" placeholder="nombre nuevo board">
    <button id="new-board-btn">New Board</button>
    <input id="board-id-input" placeholder="boardId a cargar">
    <button id="load-board-btn">Load Board</button>
    <button id="add-rectangle-btn">+ Rectangle</button>
    <input id="text-content-input" placeholder="texto">
    <button id="add-text-btn">+ Text</button>
    <button id="connect-btn">Connect</button>
    <button id="delete-btn">Delete</button>
    <button id="save-btn">Save</button>
    <button id="retry-btn" disabled>Retry</button>
    <span id="board-id-display">Sin board cargado</span>
</div>
<svg id="board-svg"></svg>
<div id="hint-bar" class="hint"></div>
<div id="status-bar" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
