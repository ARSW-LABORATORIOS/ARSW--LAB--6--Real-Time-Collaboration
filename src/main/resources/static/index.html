<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARSW Collaborative Board</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 32px auto; padding: 0 24px; line-height: 1.5; color: #1e293b; background: #f1f5f9; }
        h1 { color: #1e293b; font-size: 1.4rem; margin-bottom: 12px; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; background: #fff; padding: 10px 14px; border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .toolbar button { padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; color: #334155; cursor: pointer; font-size: 13px; transition: background .15s; }
        .toolbar button:hover { background: #e2e8f0; }
        .toolbar button:disabled { opacity: .45; cursor: default; }
        .toolbar input { padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 140px; font-size: 13px; color: #334155; }
        #board-id-display { margin-left: auto; align-self: center; color: #64748b; font-size: 13px; }
        #board-svg { border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; width: 100%; height: 520px; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
        .status, .hint { margin-top: 8px; padding: 6px 12px; border-radius: 6px; font-size: 13px; min-height: 20px; }
        .status-loading { background: #fef9c3; color: #854d0e; }
        .status-success { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }
        .hint { background: #eff6ff; color: #1e40af; }
        .hint:empty { display: none; }
        .board-element.rectangle { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; cursor: move; }
        .board-element.rectangle.selected { stroke: #f97316; stroke-width: 2.5; }
        .text-background { fill: #fefce8; stroke: #eab308; stroke-width: 1.5; cursor: move; }
        .board-element.text.selected .text-background { stroke: #f97316; stroke-width: 2.5; }
        .text-content { font-size: 13px; fill: #1e293b; pointer-events: none; }
        .connector { stroke: #94a3b8; stroke-width: 2; }
    </style>
</head>
<body>
<h1>ARSW Collaborative Architecture Board</h1>
<div class="toolbar">
    <input id="board-name-input" placeholder="nombre nuevo board">
    <button id="new-board-btn">New Board</button>
    <input id="board-id-input" placeholder="boardId a cargar">
    <button id="load-board-btn">Load Board</button>
    <button id="add-rectangle-btn">+ Rectangle</button>
    <input id="text-content-input" placeholder="texto">
    <button id="add-text-btn">+ Text</button>
    <button id="connect-btn">Connect</button>
    <button id="delete-btn">Delete</button>
    <button id="save-btn">Save</button>
    <button id="retry-btn" disabled>Retry</button>
    <span id="board-id-display">Sin board cargado</span>
</div>
<svg id="board-svg"></svg>
<div id="hint-bar" class="hint"></div>
<div id="status-bar" class="status"></div>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
